[project]
name = "quillnight-sidecar"
version = "0.0.0"
description = "Local domain/AI backend for the Quillnight story app (FastAPI, SQLAlchemy, Alembic)."
requires-python = ">=3.11"
# Top-level deps pinned to the versions resolved on 2026-07-22. The full transitive lock is
# in requirements.lock.txt (committed). Official registry (PyPI) only — docs/02 §security.
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "litellm==1.91.4",
    "argon2-cffi==25.1.0",
    "Pillow==12.3.0",
    "Jinja2==3.1.6",
    "python-docx==1.2.0",
    "screenplay-tools==0.0.10",
    # WeasyPrint requires the native GTK/Pango/cairo runtime, which is not present on this
    # Windows build laptop (`import weasyprint` fails with OSError: cannot load
    # 'libgobject-2.0-0'). Falling back to reportlab, which is pure-Python + Pillow only.
    "reportlab==5.0.0",
]

# Deferred to their roadmap phases so this install stays model-free
# (docs/06). Added when their phase begins — NOT installed on the restrictive build laptop:
#   Phase 2  voice STT: onnx-asr[cpu,hub], sounddevice, silero-vad
#   Phase 7  security:  pyrage
#   Phase 10 semantic:  sqlite-vec

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/*" = ["E501"]

# FastAPI's dependency-injection markers are the canonical, intended use of a call in an
# argument default (B008). Treat them as immutable so B008 stops flagging every route.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body", "fastapi.Form", "fastapi.File", "fastapi.Cookie"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
