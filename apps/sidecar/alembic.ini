# Alembic config for the Quillnight sidecar.
# The sqlalchemy.url is injected at runtime from app.config (see app/db/migrate.py and
# app/db/migrations/env.py); the value here is only used for manual CLI runs and is
# overridden programmatically.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# path separators normalized for cross-platform (Windows) runs
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
